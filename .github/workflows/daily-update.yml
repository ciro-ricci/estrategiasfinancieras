name: Actualizar datos del dashboard

# Corre todos los dias a las 20:00 hora Argentina (23:00 UTC, Argentina no
# tiene horario de verano asi que el offset es fijo -3). Tambien se puede
# disparar a mano desde la pestaña "Actions" de GitHub con el boton
# "Run workflow" (eso es lo que habilita workflow_dispatch).
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: {}

# GitHub le da automaticamente a este workflow un token temporal propio
# (GITHUB_TOKEN), generado y manejado enteramente por GitHub. Este permiso
# le da a ese token permiso de escritura sobre el repo para poder pushear.
# Nadie (ni Ciro ni Claude) ve ni administra ese token: existe solo mientras
# corre el workflow y despues se descarta.
permissions:
  contents: write
  issues: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl

      # Cada scraper corre como paso independiente con continue-on-error,
      # para que si uno falla (ej. una fuente caida) los demas igual corran,
      # tal como funcionaba antes con el bot de Claude.
      - name: Scraper - Futuros Dolar
        run: python3 scripts/scrape_futuros_dolar.py
        continue-on-error: true

      - name: Scraper - FX BCRA
        run: python3 scripts/scrape_fx_bcra.py
        continue-on-error: true

      - name: Scraper - FX Financiero
        run: python3 scripts/scrape_fx_financiero.py
        continue-on-error: true

      - name: Actualizar serie historica FX
        run: python3 scripts/update_fx_historico.py
        continue-on-error: true

      - name: Scraper - REM
        run: python3 scripts/scrape_rem.py
        continue-on-error: true

      - name: Scraper - Bonos
        run: python3 scripts/scrape_bonos.py
        continue-on-error: true

      # Tasas de Referencia (BADLAR/Adelantos/Caucion) no se scrapea a diario:
      # son tasas de referencia que no varian tanto intradia, y el usuario pidio
      # que se actualicen solo una vez por semana, los lunes. Este workflow
      # corre todos los dias, asi que este paso se auto-limita chequeando el
      # dia de la semana en hora Argentina antes de correr el scraper.
      - name: Determinar si es lunes (Argentina)
        id: chequeo_dia
        run: |
          dia=$(TZ='America/Argentina/Buenos_Aires' date +%u)
          echo "dia=$dia" >> "$GITHUB_OUTPUT"

      - name: Scraper - Tasas de Referencia (semanal, solo lunes)
        if: steps.chequeo_dia.outputs.dia == '1' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/scrape_tasas_referencia_web.py
        continue-on-error: true

      - name: Commitear y pushear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "Sin cambios en los datos, no se commitea nada."
          else
            git commit -m "data: actualizacion automatica $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "Cambios pusheados a GitHub."
          fi

      # ---- Control de frescura de datos --------------------------------------
      # Los scrapers corren con continue-on-error, asi que si uno falla (ej. el
      # BCRA devolviendo 403) el workflow igual da "exito" y el dashboard queda
      # con el dato viejo. Este paso mira el RESULTADO: que cada archivo de
      # data/ sea reciente y tenga valores razonables. Corre despues del commit
      # para que los datos buenos igual se publiquen.
      - name: Verificar frescura y sanidad de los datos
        id: verif
        run: python3 scripts/verificar_datos.py --reporte reporte_datos.md
        continue-on-error: true

      - name: Mostrar el reporte en la pagina de la corrida
        if: always()
        run: |
          if [ -f reporte_datos.md ]; then cat reporte_datos.md >> "$GITHUB_STEP_SUMMARY"; fi

      # Si hay errores abre (o comenta) un issue de alerta; cuando todo vuelve a
      # la normalidad lo cierra solo.
      - name: Abrir o cerrar el issue de alerta
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ steps.verif.outcome }}
          URL_CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITULO: "ALERTA: datos del dashboard desactualizados o con errores"
        run: |
          NUM=$(gh issue list --state open --json number,title --jq '.[] | select(.title==env.TITULO) | .number' | head -n 1)
          if [ "$RESULTADO" = "failure" ]; then
            { cat reporte_datos.md; echo; echo "Corrida: $URL_CORRIDA"; } > cuerpo_alerta.md
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body-file cuerpo_alerta.md
            else
              gh issue create --title "$TITULO" --body-file cuerpo_alerta.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Los datos volvieron a la normalidad. Se cierra automaticamente."
            gh issue close "$NUM"
          fi

      - name: Marcar la corrida como fallida si el control encontro errores
        if: steps.verif.outcome == 'failure'
        run: |
          echo "Hay datos desactualizados o con errores. Ver el resumen de la corrida."
          exit 1
